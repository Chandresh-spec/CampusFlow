name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: run-pytest
        run: python -m pytest -v
        working-directory: backend




       

    